name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AskAny.sln

      - name: Build
        run: dotnet build AskAny.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/AskAny/AskAny.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/AskAny

      - name: Generate UI previews
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ui | Out-Null
          $exe = Join-Path $PWD artifacts/AskAny/AskAny.exe
          $captures = @(
            @{ Path = "artifacts/ui/settings-model.png"; Arguments = @("--screenshot-settings", "artifacts/ui/settings-model.png", "0") },
            @{ Path = "artifacts/ui/settings-functions.png"; Arguments = @("--screenshot-settings", "artifacts/ui/settings-functions.png", "1") },
            @{ Path = "artifacts/ui/settings-search.png"; Arguments = @("--screenshot-settings", "artifacts/ui/settings-search.png", "2") },
            @{ Path = "artifacts/ui/main.png"; Arguments = @("--screenshot", "artifacts/ui/main.png") }
          )
          foreach ($capture in $captures) {
            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList $capture.Arguments `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
            Write-Host "$($capture.Path) exit code: $($process.ExitCode)"
            if (-not (Test-Path $capture.Path)) {
              throw "Failed to render $($capture.Path)"
            }
          }

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: AskAny-win-x64
          path: artifacts/AskAny
          if-no-files-found: error

      - name: Upload UI previews
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: AskAny-ui-previews
          path: artifacts/ui
          if-no-files-found: error

