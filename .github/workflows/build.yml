name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AskAny.sln

      - name: Build
        run: dotnet build AskAny.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/AskAny/AskAny.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/AskAny

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: AskAny-win-x64
          path: artifacts/AskAny
          if-no-files-found: error

